<!-- _all_notifications.html -->
<div hx-get="{% url 'notifly:all_notifications' %}" hx-trigger="load, every 60s" hx-swap="outerHTML">
  <ul class="list-group">
    {% for notification in notifications %}
        <li class="list-group-item">{{ notification.notification.message }}</li>
    {% empty %}
        <li class="list-group-item">Aucune notification.</li>
    {% endfor %}
  </ul>
</div>
