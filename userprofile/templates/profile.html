{% load static %}
{% load django_notifly_tags %}

<div class="dropdown text-center">
    <button class="btn dropdown-toggle px-3 py-2" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false" style="background: rgba(255,255,255,0.15); border: none; border-radius: 12px; backdrop-filter: blur(5px);">
        <div class="d-flex align-items-center">
            <div class="position-relative">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" alt="Avatar" class="rounded-circle" style="width: 45px; height: 45px; object-fit: cover; border: 2px solid #f8d568;">
                {% else %}
                    <img src="{% static 'images/avatar.jpg' %}" alt="Avatar" class="rounded-circle" style="width: 45px; height: 45px; object-fit: cover; border: 2px solid #f8d568;">
                {% endif %}
                
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill" style="background-color: #ff4d4d; border: 2px solid white; padding: 0.35em 0.6em;">
                    {% unread_notifications_count %}
                    <span class="visually-hidden">notifications non lues</span>
                </span>
            </div>
            
            <span class="ms-2 text-white d-none d-sm-inline" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">{{ user.username }}</span>
        </div>
    </button>

    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton" style="border-radius: 12px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.15); min-width: 220px; margin-top: 8px;">
        <li class="px-3 py-2 text-center">
            <div class="position-relative d-inline-block">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" alt="Avatar" class="rounded-circle" style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #5a3e36;">
                {% else %}
                    <img src="{% static 'images/avatar.jpg' %}" alt="Avatar" class="rounded-circle" style="width: 80px; height: 80px; object-fit: cover; border: 3px solid #5a3e36;">
                {% endif %}
            </div>
            <h6 class="mt-2 mb-0 fw-bold" style="color: #5a3e36;">{{ user.username }}</h6>
            <small class="text-muted">{{ user.email }}</small>
        </li>
        <li><hr class="dropdown-divider my-2"></li>
        <li><a class="dropdown-item py-2" href="#"><i class="bi bi-person-fill me-2" style="color: #5a3e36;"></i>Votre Profile</a></li>
        <li><a class="dropdown-item py-2" href="#"><i class="bi bi-gear-fill me-2" style="color: #5a3e36;"></i>Paramètres</a></li>
        <li><hr class="dropdown-divider my-2"></li>
        <li>
            <a class="dropdown-item py-2 d-flex justify-content-between align-items-center" href="{% url 'notifications' %}">
                <span><i class="bi bi-bell-fill me-2" style="color: #5a3e36;"></i>Notifications</span>
                <span class="badge rounded-pill" style="background-color: #ff4d4d;">{% unread_notifications_count %}</span>
            </a>
        </li>
        <li><hr class="dropdown-divider my-2"></li>
        <li><a class="dropdown-item py-2" href="/user/logout" style="color: #d9534f;"><i class="bi bi-box-arrow-right me-2"></i>Se déconnecter</a></li>
    </ul>
</div>
